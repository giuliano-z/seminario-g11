<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registro de decisiones — Grupo 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --acero:#C9CFD2; --acero-osc:#A9B2B7; --papel:#FBFAF6; --papel-bis:#F1EFE7;
  --tinta:#16242B; --tinta-sw:#5D6E76; --linea:#D8D3C6;
  --definida:#2C6B4F; --debate:#B87503; --consultar:#24588A; --bloqueada:#9E2F2A;
  --marca:#F2C12E;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--acero);
  background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.06));
  color:var(--tinta); font-family:var(--sans); font-size:16px; line-height:1.55;
  display:flex; flex-direction:column; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--marca); outline-offset:2px}

/* ---------- cabecera ---------- */
header{
  padding:18px 24px 12px; border-bottom:1px solid var(--acero-osc);
  background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);
}
.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{
  font-family:var(--cond); font-weight:700; font-size:30px; letter-spacing:.01em;
  margin:0; line-height:1;
}
h1 span{font-weight:400;color:var(--tinta-sw)}
.marcador{
  font-family:var(--cond); font-size:17px; color:var(--tinta-sw);
  display:flex; gap:14px; flex-wrap:wrap; margin-left:auto; align-items:center;
}
.marcador b{font-weight:600;color:var(--tinta)}
.fuente{
  font-family:var(--cond); font-size:14px; padding:2px 9px; border:1px solid var(--acero-osc);
  border-radius:2px; color:var(--tinta-sw); background:rgba(255,255,255,.45);
}
.fuente.viva{border-color:var(--definida);color:var(--definida)}
.fuente.falla{border-color:var(--bloqueada);color:var(--bloqueada)}

/* ---------- riel de fichas ---------- */
.riel{display:flex;gap:3px;margin-top:14px;height:26px;align-items:flex-end}
.tick{
  flex:1 1 0; min-width:4px; height:14px; background:var(--acero-osc);
  border:none; border-radius:1px 1px 0 0; transition:height .12s ease, background .12s ease;
  position:relative;
}
.tick[data-e="DEFINIDA"]{background:var(--definida);opacity:.55}
.tick[data-e="EN DEBATE"]{background:var(--debate)}
.tick[data-e="A CONSULTAR"]{background:var(--consultar)}
.tick[data-e="BLOQUEADA"]{background:var(--bloqueada)}
.tick:hover{height:20px}
.tick.on{height:26px;box-shadow:inset 0 -4px 0 var(--marca)}

/* ---------- vistas ---------- */
nav.vistas{display:flex;gap:0;padding:0 24px;border-bottom:1px solid var(--acero-osc)}
nav.vistas button{
  font-family:var(--cond); font-size:19px; letter-spacing:.01em;
  padding:10px 16px; color:var(--tinta-sw); border-bottom:3px solid transparent; margin-bottom:-1px;
}
nav.vistas button.on{color:var(--tinta);border-bottom-color:var(--tinta)}
nav.vistas button:hover{color:var(--tinta)}

main{flex:1;display:flex;flex-direction:column;padding:22px 24px 0;overflow:hidden}

/* ---------- ficha ---------- */
.pista{flex:1;display:flex;align-items:stretch;justify-content:center;overflow:hidden}
.ficha{
  width:min(920px,100%); background:var(--papel);
  border:1px solid var(--linea); border-top:5px solid var(--tinta);
  box-shadow:0 1px 0 rgba(255,255,255,.6), 0 10px 24px -18px rgba(0,0,0,.5);
  display:flex; flex-direction:column; overflow:hidden;
}
.ficha.mov{animation:entra .16s ease}
@keyframes entra{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ficha.mov{animation:none}}

.ficha-cab{
  display:flex;align-items:center;gap:14px;padding:12px 22px;
  border-bottom:1px solid var(--linea); background:var(--papel-bis);
}
.id{
  font-family:var(--cond); font-weight:700; font-size:26px; letter-spacing:.04em; line-height:1;
}
.estado{
  font-family:var(--cond); font-weight:600; font-size:15px; letter-spacing:.06em;
  padding:3px 10px; color:#fff; border-radius:2px;
}
.estado[data-e="DEFINIDA"]{background:var(--definida)}
.estado[data-e="EN DEBATE"]{background:var(--debate)}
.estado[data-e="A CONSULTAR"]{background:var(--consultar)}
.estado[data-e="BLOQUEADA"]{background:var(--bloqueada)}
.cab-meta{margin-left:auto;font-family:var(--cond);font-size:16px;color:var(--tinta-sw)}

.ficha-cuerpo{padding:20px 22px 24px;overflow-y:auto}
.pregunta{
  font-family:var(--cond); font-weight:600; font-size:clamp(24px,3.2vw,36px);
  line-height:1.1; margin:0 0 18px; max-width:26ch;
}
.campo{border-top:1px solid var(--linea);padding:12px 0}
.campo:first-of-type{border-top:none;padding-top:0}
.rot{
  font-family:var(--cond); font-size:15px; letter-spacing:.05em; color:var(--tinta-sw);
  margin:0 0 3px;
}
.txt{margin:0;max-width:72ch;white-space:pre-line}
.txt.grande{font-size:17px}
.pie{
  display:flex;gap:22px;flex-wrap:wrap;border-top:1px solid var(--linea);
  padding-top:12px;margin-top:6px;font-family:var(--cond);font-size:16px;color:var(--tinta-sw);
}
.pie b{font-weight:600;color:var(--tinta)}
.vacio{color:var(--tinta-sw);font-style:italic}

/* ---------- navegación ---------- */
.nav{display:flex;align-items:center;justify-content:center;gap:20px;padding:14px 0 20px}
.nav button{
  font-family:var(--cond);font-size:20px;padding:6px 18px;
  border:1px solid var(--acero-osc);border-radius:2px;background:rgba(255,255,255,.5);
}
.nav button:hover:not(:disabled){background:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.conteo{font-family:var(--cond);font-size:18px;color:var(--tinta-sw);min-width:9ch;text-align:center}

/* ---------- vista por sección ---------- */
.secciones{overflow-y:auto;padding-bottom:30px}
.sec{margin-bottom:26px;max-width:980px}
.sec h2{
  font-family:var(--cond);font-weight:700;font-size:23px;margin:0 0 3px;
  display:flex;align-items:baseline;gap:10px;
}
.sec h2 em{font-style:normal;font-family:var(--sans);font-size:14px;color:var(--tinta-sw);font-weight:400}
.sec-sub{margin:0 0 10px;color:var(--tinta-sw);font-size:14px;max-width:70ch}
.fila{
  display:flex;gap:14px;align-items:flex-start;padding:10px 14px;background:var(--papel);
  border:1px solid var(--linea);border-bottom:none;text-align:left;width:100%;
}
.sec .fila:last-child{border-bottom:1px solid var(--linea)}
.fila:hover{background:#fff}
.fila .id{font-size:19px;min-width:3.6em}
.fila-txt{flex:1}
.fila-q{font-weight:500;display:block}
.fila-d{color:var(--tinta-sw);font-size:14px;display:block;margin-top:2px}
.punto{width:9px;height:9px;border-radius:50%;margin-top:8px;flex:none}
.punto[data-e="DEFINIDA"]{background:var(--definida)}
.punto[data-e="EN DEBATE"]{background:var(--debate)}
.punto[data-e="A CONSULTAR"]{background:var(--consultar)}
.punto[data-e="BLOQUEADA"]{background:var(--bloqueada)}

footer{
  padding:10px 24px;border-top:1px solid var(--acero-osc);
  font-family:var(--cond);font-size:15px;color:var(--tinta-sw);
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;
}
footer a{color:var(--tinta)}
.teclas{margin-left:auto}
kbd{
  font-family:var(--cond);border:1px solid var(--acero-osc);border-bottom-width:2px;
  border-radius:3px;padding:0 6px;background:rgba(255,255,255,.6);font-size:14px;
}
.procesos{overflow:auto;padding-bottom:24px}
.proc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.proc-tabs button{
  font-family:var(--cond);font-size:17px;padding:5px 14px;border:1px solid var(--acero-osc);
  border-radius:2px;background:rgba(255,255,255,.5);color:var(--tinta-sw);
}
.proc-tabs button.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.proc-nota{margin:0 0 14px;max-width:74ch;color:var(--tinta-sw);font-size:15px}
.lienzo{display:flex;gap:16px;align-items:flex-start}
.lienzo figure{margin:0;flex:1;background:#11171B;border:1px solid var(--tinta);padding:10px}
.lienzo figcaption{
  font-family:var(--cond);font-size:16px;color:#C9CFD2;padding:0 0 8px;letter-spacing:.03em;
}
.lienzo img{width:100%;display:block;cursor:zoom-in}
.lupa{
  position:fixed;inset:0;background:rgba(10,14,17,.94);z-index:50;display:none;
  overflow:auto;padding:20px;cursor:zoom-out;
}
.lupa.on{display:block}
.lupa img{width:auto;max-width:none;margin:0 auto;display:block}
@media (max-width:900px){.lienzo{flex-direction:column}}
@media (max-width:700px){
  header{padding:14px 16px 10px} main{padding:16px 16px 0} nav.vistas{padding:0 16px}
  h1{font-size:24px} .marcador{margin-left:0;font-size:15px;width:100%}
  .ficha-cuerpo{padding:16px}
  .pregunta{max-width:none}
}
</style>
</head>
<body>
<header>
<div class="top">
<h1>Registro de decisiones <span>· Grupo 11</span></h1>
<div class="marcador">
<b id="vivas" class="fuente viva"></b>
<b id="debate" class="fuente"></b>
<b id="consultar" class="fuente"></b>
<b id="falla" class="fuente falla"></b>
</div>
</div>
<div class="riel" id="riel"></div>
</header>

<nav class="vistas">
<button data-tab="fichas" class="on">Por decidir</button>
<button data-tab="secciones">Por sección del informe</button>
<button data-tab="procesos">Los dos circuitos</button>
</nav>

<main>
<div id="fichas" class="tab-content">
<div class="pista">
<div class="ficha" id="ficha">
<div class="ficha-cab">
<div class="id" id="fid"></div>
<div class="estado" id="fest" data-e=""></div>
<div class="cab-meta"><span id="fmeta"></span></div>
</div>
<div class="ficha-cuerpo">
<div class="pregunta" id="fpreg"></div>
<div class="campo">
<p class="rot">Cómo funciona hoy</p>
<p class="txt" id="fcomo"></p>
</div>
<div class="campo">
<p class="rot">Variantes</p>
<p class="txt" id="fvar"></p>
</div>
<div class="campo">
<p class="rot">Decisión</p>
<p class="txt grande" id="fdec"></p>
</div>
<div class="campo">
<p class="rot">Por qué / Consecuencia</p>
<p class="txt" id="fpq"></p>
</div>
<div class="campo">
<p class="rot">Descartadas y por qué</p>
<p class="txt" id="fdesc"></p>
</div>
<div class="campo">
<p class="rot">Impacto en el informe</p>
<p class="txt" id="fimp"></p>
</div>
</div>
</div>
</div>
<div class="nav">
<button id="prev" class="nav-btn">‹ anterior</button>
<div class="conteo"><span id="idx"></span> / <span id="tot"></span></div>
<button id="next" class="nav-btn">siguiente ›</button>
</div>
</div>

<div id="secciones" class="tab-content" style="display:none">
<div class="secciones" id="secciones-content"></div>
</div>

<div id="procesos" class="tab-content" style="display:none">
<div class="procesos">
<p class="proc-nota">Diagrama general de actividades del proyecto</p>
<div class="lienzo" id="procesos-content">
</div>
</div>
</div>
</main>

<footer>
<span id="link">Datos locales</span>
<div class="teclas">
<kbd>←</kbd> <kbd>→</kbd> para moverte · <kbd>1</kbd>–<kbd>4</kbd> cambia de vista
</div>
</footer>

<div class="lupa" id="lupa" onclick="this.classList.remove('on')">
<img id="zoom-img" src="">
</div>

<script>
// Configuración
const COLS = {
  id: 0,
  pregunta: 1,
  estado: 2,
  como: 3,
  variantes: 4,
  decision: 5,
  porque: 6,
  descartadas: 7,
  impacto: 8
};

const ESTADOS = {
  DEFINIDA: { bg: '#2C6B4F', label: 'Definida' },
  'EN DEBATE': { bg: '#B87503', label: 'En debate' },
  'A CONSULTAR': { bg: '#24588A', label: 'A consultar' },
  BLOQUEADA: { bg: '#9E2F2A', label: 'Bloqueada' }
};

let decisiones = [];
let idx = 0;
let ficha_id = 'ficha';

// Cargar datos desde Google Sheets
async function cargarDatos() {
  const id = 'g9_decisiones'; // localStorage key
  const cached = localStorage.getItem(id);
  if (cached) {
    decisiones = JSON.parse(cached);
    iniciar();
    return;
  }

  // Si no hay caché, mostrar opción de cargar manualmente
  const sheet_url = prompt(
    'Pegá la URL de Google Sheets exportada como CSV, o dejá en blanco para cargar desde el archivo local (G9-Decisiones-LIMPIO.xlsx)',
    ''
  );
  
  if (sheet_url) {
    try {
      const resp = await fetch(sheet_url);
      const csv = await resp.text();
      decisiones = parseCSV(csv);
      localStorage.setItem(id, JSON.stringify(decisiones));
      iniciar();
    } catch (e) {
      console.error('Error cargando desde URL:', e);
      alert('Error cargando datos. Cargando desde archivo local...');
      cargarLocal();
    }
  } else {
    cargarLocal();
  }
}

function parseCSV(csv) {
  const lines = csv.split('\n').filter(l => l.trim());
  const headers = lines[0].split(',').map(h => h.trim());
  const data = [];
  
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(',').map(c => c.trim());
    const row = {};
    headers.forEach((h, j) => {
      row[h] = cells[j] || '';
    });
    if (row.ID && row.ID.startsWith('D-')) {
      data.push(row);
    }
  }
  return data;
}

// Cargar desde Excel local
function cargarLocal() {
  // Dummy data para demostración
  decisiones = [
    {
      'ID': 'D-01',
      'PREGUNTA': '¿Qué abastece el almacén y qué queda afuera?',
      'ESTADO': 'DEFINIDA',
      'CÓMO FUNCIONA HOY': 'Un almacén único abastece toda la Fábrica Santa Isabel con material no productivo.',
      'VARIANTES': 'V1 — Almacén solo de Mantenimiento.\nV2 — Almacén de toda la fábrica.',
      'DECISIÓN': 'V2. El almacén abastece a toda la fábrica con material no productivo.',
      'POR QUÉ / CONSECUENCIA': 'Hecho del dominio confirmado por Mauricio. La profe preguntó explícitamente.',
      'DESCARTADAS Y POR QUÉ': 'V1 describía mal la realidad.',
      'IMPACTO EN EL INFORME': '1 Intro · 4.1 · 4.2 Límites · 5.1 · 6.1'
    }
  ];
  iniciar();
}

function iniciar() {
  if (!decisiones.length) {
    cargarLocal();
    return;
  }
  
  actualizarRiel();
  mostrarFicha(0);
  vincularEventos();
  llenarSecciones();
}

function actualizarRiel() {
  const riel = document.getElementById('riel');
  riel.innerHTML = '';
  const contar = {};
  decisiones.forEach((d, i) => {
    const e = d['ESTADO'];
    contar[e] = (contar[e] || 0) + 1;
    const tick = document.createElement('button');
    tick.className = 'tick';
    tick.dataset.e = e;
    tick.onclick = () => mostrarFicha(i);
    riel.appendChild(tick);
  });
  document.getElementById('vivas').textContent = contar.DEFINIDA + ' definidas';
  document.getElementById('debate').textContent = contar['EN DEBATE'] + ' en debate';
  document.getElementById('consultar').textContent = contar['A CONSULTAR'] + ' a consultar';
  document.getElementById('falla').textContent = contar.BLOQUEADA + ' bloqueadas';
  document.getElementById('tot').textContent = decisiones.length;
}

function mostrarFicha(n) {
  idx = Math.max(0, Math.min(n, decisiones.length - 1));
  const d = decisiones[idx];
  
  document.getElementById('fid').textContent = d.ID;
  document.getElementById('fest').textContent = d.ESTADO;
  document.getElementById('fest').dataset.e = d.ESTADO;
  document.getElementById('fmeta').textContent = (idx + 1) + ' / ' + decisiones.length;
  document.getElementById('fpreg').textContent = d.PREGUNTA;
  document.getElementById('fcomo').textContent = d['CÓMO FUNCIONA HOY'] || '(No aplica)';
  document.getElementById('fvar').textContent = d.VARIANTES || '(No aplica)';
  document.getElementById('fdec').textContent = d.DECISIÓN || '(Pendiente)';
  document.getElementById('fpq').textContent = d['POR QUÉ / CONSECUENCIA'] || '(Pendiente)';
  document.getElementById('fdesc').textContent = d['DESCARTADAS Y POR QUÉ'] || '(No aplica)';
  document.getElementById('fimp').textContent = d['IMPACTO EN EL INFORME'] || '(A definir)';
  
  document.getElementById('idx').textContent = idx + 1;
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === decisiones.length - 1;
  
  // Actualizar ticks
  document.querySelectorAll('.tick').forEach((t, i) => {
    t.classList.toggle('on', i === idx);
  });
  
  document.querySelector('.ficha').classList.add('mov');
  setTimeout(() => document.querySelector('.ficha').classList.remove('mov'), 160);
}

function llenarSecciones() {
  const secciones = {};
  decisiones.forEach(d => {
    const impacto = d['IMPACTO EN EL INFORME'] || '';
    const partes = impacto.split('·').map(p => p.trim());
    partes.forEach(p => {
      if (!secciones[p]) secciones[p] = [];
      secciones[p].push(d);
    });
  });
  
  const html = Object.entries(secciones)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([sec, decs]) => {
      const filas = decs.map(d => `
        <button class="fila" onclick="buscarYMostrar('${d.ID}')">
          <div class="punto" data-e="${d.ESTADO}"></div>
          <div class="fila-txt">
            <span class="fila-q">${d.PREGUNTA}</span>
            <span class="fila-d">${d.ID}</span>
          </div>
        </button>
      `).join('');
      return `
        <div class="sec">
          <h2>${sec} <em>${decs.length}</em></h2>
          ${filas}
        </div>
      `;
    }).join('');
  
  document.getElementById('secciones-content').innerHTML = html;
}

function buscarYMostrar(id) {
  const i = decisiones.findIndex(d => d.ID === id);
  if (i >= 0) {
    document.querySelector('[data-tab="fichas"]').click();
    mostrarFicha(i);
  }
}

function vincularEventos() {
  document.querySelectorAll('nav.vistas button').forEach(btn => {
    btn.onclick = (e) => {
      document.querySelectorAll('nav.vistas button').forEach(b => b.classList.remove('on'));
      e.target.classList.add('on');
      document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
      document.getElementById(e.target.dataset.tab).style.display = 'block';
    };
  });
  
  document.getElementById('prev').onclick = () => mostrarFicha(idx - 1);
  document.getElementById('next').onclick = () => mostrarFicha(idx + 1);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') mostrarFicha(idx - 1);
    if (e.key === 'ArrowRight') mostrarFicha(idx + 1);
    if (e.key >= '1' && e.key <= '4') {
      const tabs = document.querySelectorAll('nav.vistas button');
      tabs[parseInt(e.key) - 1]?.click();
    }
  });
}

window.addEventListener('load', cargarDatos);
</script>
</body>
</html>
